name: CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  build:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      
      - name: Install Dependencies
        run: npm install

      - name: Run tests
        run: npm test
        
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository }}:${{ github.sha }} .

      - name: Set image metadata
        id: meta
        run: echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Push Docker Image
        run: |
          docker push \
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy-development:
    needs: build
    runs-on: ubuntu-latest
    environment: development

    steps:
      # SSH to DigitalOcean
      # pull image
      # restart container
      
      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_USERNAME,GHCR_TOKEN,IMAGE_TAG
          script: |
            NEW_IMAGE="ghcr.io/kehindejejelaye/github-actions-learning:$IMAGE_TAG"

            echo "New image: $NEW_IMAGE"

            echo "Checking currently deployed image..."

            OLD_IMAGE=$(docker inspect \
              --format='{{.Config.Image}}' \
              github-actions-learning 2>/dev/null || true)

            if [ -n "$OLD_IMAGE" ]; then
              echo "Previous image: $OLD_IMAGE"
            else
              echo "No previous deployment found"
            fi

            echo "Pulling new image..."
            docker pull "$NEW_IMAGE"

            echo "Stopping current container..."
            docker rm -f github-actions-learning 2>/dev/null || true

            echo "Starting new container..."
            docker run -d \
              --name github-actions-learning \
              -p 3000:3000 \
              "$NEW_IMAGE"

            echo "Waiting for application to start..."
            sleep 3

            echo "Running health check..."

            if curl --fail --silent http://localhost:3000/health; then
              echo ""
              echo "Health check passed"
              echo "Deployment completed successfully"
              docker ps -a
              exit 0
            fi

            echo ""
            echo "Health check FAILED"

            if [ -z "$OLD_IMAGE" ]; then
              echo "No previous image available for rollback"
              docker logs github-actions-learning
              exit 1
            fi

            echo "Rolling back to: $OLD_IMAGE"

            docker rm -f github-actions-learning 2>/dev/null || true

            docker run -d \
              --name github-actions-learning \
              -p 3000:3000 \
              "$OLD_IMAGE"

            echo "Waiting for rollback..."
            sleep 3

            echo "Verifying rollback..."

            if curl --fail --silent http://localhost:3000/health; then
              echo ""
              echo "Rollback successful"
              docker ps -a
            else
              echo ""
              echo "CRITICAL: Rollback also failed"
              docker logs github-actions-learning
            fi

            exit 1
        env: 
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ vars.GHCR_TOKEN }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}

  deploy-staging:
    needs: [build, deploy-development]
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Deploy to Staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_USERNAME,GHCR_TOKEN,IMAGE_TAG
          script: |
            if [ -z "$IMAGE_TAG" ]; then
              echo "ERROR: IMAGE_TAG is empty"
              exit 1
            fi

            NEW_IMAGE="ghcr.io/kehindejejelaye/github-actions-learning:$IMAGE_TAG"

            echo "Deploying $NEW_IMAGE"

            echo "$GHCR_TOKEN" | docker login ghcr.io \
              -u "$GHCR_USERNAME" \
              --password-stdin

            docker pull "$NEW_IMAGE"

            OLD_IMAGE=$(docker inspect \
              --format='{{.Config.Image}}' \
              github-actions-learning 2>/dev/null || true)

            if [ -n "$OLD_IMAGE" ]; then
              echo "Previous image: $OLD_IMAGE"
            else
              echo "No previous deployment found"
            fi

            docker rm -f github-actions-learning 2>/dev/null || true

            docker run -d \
              --name github-actions-learning \
              -p 3000:3000 \
              "$NEW_IMAGE"

            echo "Waiting for application to start..."
            sleep 3

            echo "Running health check..."

            if curl --fail --silent http://localhost:3000/health; then
              echo ""
              echo "Health check passed"
              echo "Staging deployment completed successfully"
              docker ps -a
              exit 0
            fi

            echo ""
            echo "Health check FAILED"

            if [ -z "$OLD_IMAGE" ]; then
              echo "No previous image available for rollback"
              docker logs github-actions-learning
              exit 1
            fi

            echo "Rolling back to: $OLD_IMAGE"

            docker rm -f github-actions-learning 2>/dev/null || true

            docker run -d \
              --name github-actions-learning \
              -p 3000:3000 \
              "$OLD_IMAGE"

            sleep 3

            echo "Verifying rollback..."

            if curl --fail --silent http://localhost:3000/health; then
              echo ""
              echo "Rollback successful"
            else
              echo ""
              echo "CRITICAL: Rollback also failed"
              docker logs github-actions-learning
            fi

            exit 1

        env:
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ vars.GHCR_TOKEN }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}

  deploy-production:
    needs: [build, deploy-development, deploy-staging]
    runs-on: ubuntu-latest

    concurrency:
      group: production
      cancel-in-progress: false

    environment: production

    steps:
      - name: Deploy to Production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_USERNAME,GHCR_TOKEN,IMAGE_TAG
          script: |
            if [ -z "$IMAGE_TAG" ]; then
              echo "ERROR: IMAGE_TAG is empty"
              exit 1
            fi

            NEW_IMAGE="ghcr.io/kehindejejelaye/github-actions-learning:$IMAGE_TAG"

            echo "Production deployment"
            echo "Image: $NEW_IMAGE"

            echo "Simulating a production deployment..."
            sleep 60

            echo "$GHCR_TOKEN" | docker login ghcr.io \
              -u "$GHCR_USERNAME" \
              --password-stdin

            docker pull "$NEW_IMAGE"

            OLD_IMAGE=$(docker inspect \
              --format='{{.Config.Image}}' \
              github-actions-learning 2>/dev/null || true)

            echo "Previous image: ${OLD_IMAGE:-none}"

            docker rm -f github-actions-learning 2>/dev/null || true

            docker run -d \
              --name github-actions-learning \
              -p 3000:3000 \
              "$NEW_IMAGE"

            echo "Waiting for application to start..."
            sleep 3

            echo "Running health check..."

            if curl --fail --silent http://localhost:3000/health; then
              echo ""
              echo "Production health check passed"
              echo "Production deployment completed successfully"
              docker ps -a
              exit 0
            fi

            echo ""
            echo "Production health check FAILED"

            if [ -z "$OLD_IMAGE" ]; then
              echo "No previous image available for rollback"
              docker logs github-actions-learning
              exit 1
            fi

            echo "Rolling back to: $OLD_IMAGE"

            docker rm -f github-actions-learning 2>/dev/null || true

            docker run -d \
              --name github-actions-learning \
              -p 3000:3000 \
              "$OLD_IMAGE"

            sleep 3

            echo "Verifying rollback..."

            if curl --fail --silent http://localhost:3000/health; then
              echo ""
              echo "Production rollback successful"
            else
              echo ""
              echo "CRITICAL: Production rollback also failed"
              docker logs github-actions-learning
            fi

            exit 1

        env:
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ vars.GHCR_TOKEN }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}          