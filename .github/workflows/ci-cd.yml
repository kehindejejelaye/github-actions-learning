name: CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  build:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      
      - name: Install Dependencies
        run: npm install

      - name: Run tests
        run: npm test
        
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository }}:${{ github.sha }} .

      - name: Set image metadata
        id: meta
        run: echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Push Docker Image
        run: |
          docker push \
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: development

    steps:
      # SSH to DigitalOcean
      # pull image
      # restart container
      
      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_USERNAME,GHCR_TOKEN,IMAGE_TAG
          script: |
            echo "Starting deployment..."

            echo "$GHCR_TOKEN" | docker login ghcr.io \
              -u "$GHCR_USERNAME" \
              --password-stdin

            docker pull ghcr.io/kehindejejelaye/github-actions-learning:$IMAGE_TAG

            echo "Image pulled successfully"

            docker rm -f github-actions-learning 2>/dev/null || true

            docker run -d \
              --name github-actions-learning \
              ghcr.io/kehindejejelaye/github-actions-learning:$IMAGE_TAG

            echo "Deployment completed"

            docker ps -a
        env: 
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ vars.GHCR_TOKEN }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}